<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paws on Map 🐾 - บันทึกการเดินทางน้องแมว</title>
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#fdfbf7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="https://img.icons8.com/emoji/192/cat-face-emoji.png">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <!-- Google Fonts (Kanit & Mitr) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap">
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Navigation Header -->
    <header class="app-header">
        <div class="header-brand">
            <span class="logo-emoji">🐾</span>
            <div>
                <h1>Paws on Map</h1>
                <p class="subtitle">รอยเท้าแมวบันทึกการเดินทางรอบโลก</p>
            </div>
        </div>

        <!-- Breadcrumb & Control Navigation -->
        <div class="nav-controls">
            <button id="btn-back" class="btn-back hidden" onclick="goBackLevel()">
                🔙 <span id="back-text">กลับระดับโลก</span>
            </button>
            <div class="continent-selector">
                <label for="continent-filter">🌍 ทวีป:</label>
                <select id="continent-filter" onchange="filterByContinent(this.value)">
                    <option value="All">ทั้งหมด (Worldwide)</option>
                    <option value="Asia">เอเชีย (Asia)</option>
                    <option value="Europe">ยุโรป (Europe)</option>
                    <option value="North America">อเมริกาเหนือ (N. America)</option>
                    <option value="South America">อเมริกาใต้ (S. America)</option>
                    <option value="Africa">แอฟริกา (Africa)</option>
                    <option value="Oceania">โอเชียเนีย (Oceania)</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Stats Bar & Badges Card -->
    <section class="dashboard-panel">
        <div class="stat-box">
            <div class="stat-number" id="stat-provinces">0</div>
            <div class="stat-label">เมืองที่เคยไป 📍</div>
        </div>
        <div class="stat-box">
            <div class="stat-number" id="stat-countries">0</div>
            <div class="stat-label">ประเทศที่พิชิต 🌍</div>
        </div>
        <div class="stat-box">
            <div class="stat-number" id="stat-airports">0</div>
            <div class="stat-label">สนามบินที่เช็กอิน ✈️</div>
        </div>
        <div class="badges-wrapper">
            <div class="badge" id="badge-asian" title="นักสำรวจแดนอาทิตย์อุทัย (ไปเอเชียอย่างน้อย 1 ประเทศ)">🍣 เอเชีย</div>
            <div class="badge" id="badge-euro" title="อุ้งเท้าท่องยุโรป (ไปยุโรปอย่างน้อย 1 ประเทศ)">🏰 ยุโรป</div>
            <div class="badge" id="badge-flyer" title="แมวเหินฟ้า (เช็กอินสนามบินครบ 3 แห่ง)">✈️ นักบินแมว</div>
            <div class="badge" id="badge-master" title="แมวนักเดินทางรุ่นใหญ่ (พิชิต 10 เมืองขึ้นไป)">👑 ตำนานอุ้งเท้า</div>
        </div>
    </section>

    <!-- Leaflet Map Container -->
    <div id="map"></div>

    <!-- Travel Diary / Scratch Memory Modal -->
    <div id="diaryModal" class="modal-overlay hidden">
        <div class="modal-card">
            <button class="modal-close" onclick="closeDiaryModal()">✖</button>
            <div class="modal-header">
                <span class="modal-icon">🐾</span>
                <h2 id="modal-title">บันทึกความทรงจำ</h2>
            </div>
            <p id="modal-subtitle" class="modal-subtitle">จังหวัด / บริเวณ</p>

            <form id="diaryForm" onsubmit="saveMemory(event)">
                <div class="form-group">
                    <label for="travel-date">📅 วันที่ไปเยือน:</label>
                    <input type="date" id="travel-date" required>
                </div>

                <div class="form-group">
                    <label for="travel-note">📝 บันทึกความทรงจำ / สถานที่เที่ยว:</label>
                    <textarea id="travel-note" rows="3" placeholder="เขียนความทรงจำสไตล์น้องแมวที่นี่..."></textarea>
                </div>

                <div class="form-group">
                    <label for="travel-img">📸 รูปภาพความทรงจำ:</label>
                    <input type="file" id="travel-img" accept="image/*" onchange="previewImage(event)">
                    <div id="img-preview-container" class="img-preview-container hidden">
                        <img id="img-preview" src="" alt="ภาพความทรงจำ">
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-delete" id="btn-delete-memory" onclick="deleteMemory()">🗑️ ลบบันทึก</button>
                    <button type="submit" class="btn-save">🐾 บันทึกความทรงจำ (Scratch!)</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <!-- Custom Application JS -->
    <script src="app.js"></script>
</body>
</html>
